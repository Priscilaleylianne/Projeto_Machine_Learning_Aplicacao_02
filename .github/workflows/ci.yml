name: CI - Projeto ML2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verificar estrutura do projeto
        run: |
          test -f notebooks/01_Analise_Exploratoria.ipynb
          test -f notebooks/02_Extracao_Features.ipynb
          test -f notebooks/03_Treinamento_SVM.ipynb
          test -f notebooks/04_Avaliacao_Resultados.ipynb
          test -f requirements.txt
          test -f README.md

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validação simples (sem treino)
        run: |
          python - <<EOF
          print("CI OK - Estrutura validada com sucesso")
          EOF
